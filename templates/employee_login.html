<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - Farm A Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Error handling for external script conflicts
        window.addEventListener('error', function(e) {
            // Ignore errors from external scripts that might conflict
            if (e.filename && (e.filename.includes('screen-shader.js') || e.filename.includes('night-mode.js'))) {
                e.preventDefault();
                return false;
            }
        });

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .dark .gradient-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .dark .glass-effect {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .login-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .dark .login-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* “Live” auth tiles: float + ring pulse + icon micro-motion */
        @keyframes login-tile-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.03); }
        }
        @keyframes login-tile-ripple {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5), 0 0 20px -5px rgba(16, 185, 129, 0.35); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0), 0 0 24px 2px rgba(16, 185, 129, 0.15); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.35), 0 0 20px -5px rgba(16, 185, 129, 0.25); }
        }
        @keyframes login-tile-ripple-teal {
            0% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.45), 0 0 20px -5px rgba(45, 212, 191, 0.3); }
            70% { box-shadow: 0 0 0 10px rgba(20, 184, 166, 0), 0 0 24px 2px rgba(45, 212, 191, 0.12); }
            100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.32), 0 0 20px -5px rgba(45, 212, 191, 0.2); }
        }
        @keyframes login-tile-ripple-rose {
            0% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.5), 0 0 20px -5px rgba(244, 114, 182, 0.28); }
            70% { box-shadow: 0 0 0 10px rgba(244, 114, 182, 0), 0 0 24px 2px rgba(244, 114, 182, 0.12); }
            100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.35), 0 0 20px -5px rgba(244, 114, 182, 0.2); }
        }
        @keyframes login-ico-breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.95; }
        }
        @keyframes login-ico-nudge {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2.5deg); }
            75% { transform: rotate(2.5deg); }
        }
        @keyframes login-fp-dash {
            0% { stroke-dashoffset: 28; opacity: 0.5; }
            50% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 28; opacity: 0.5; }
        }
        @keyframes login-shimmer-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .login-auth-tile {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-tile-shimmer {
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 90deg, transparent 0%, rgba(255, 255, 255, 0.55) 12%, transparent 28%, transparent 100%);
            opacity: 0.22;
            animation: login-shimmer-rotate 5.5s linear infinite;
            pointer-events: none;
        }
        .dark .login-tile-shimmer { opacity: 0.14; }
        .login-live-face {
            animation: login-tile-float 3.2s ease-in-out infinite, login-tile-ripple 2.2s ease-out infinite;
        }
        .login-live-finger {
            animation: login-tile-float 3.2s ease-in-out 0.35s infinite, login-tile-ripple-teal 2.2s ease-out 0.35s infinite;
        }
        .login-live-key {
            animation: login-tile-float 3.2s ease-in-out 0.7s infinite, login-tile-ripple-rose 2.2s ease-out 0.7s infinite;
        }
        .login-ico-wrap-face { animation: login-ico-breathe 2.2s ease-in-out infinite; transform-origin: 12px 12px; }
        .login-ico-wrap-fp .login-fp-stroke { stroke-dasharray: 14 28; animation: login-fp-dash 2.5s ease-in-out infinite; }
        .login-ico-wrap-fp .login-fp-stroke:nth-of-type(2) { animation-delay: 0.15s; }
        .login-ico-wrap-fp .login-fp-stroke:nth-of-type(3) { animation-delay: 0.3s; }
        .login-ico-wrap-fp .login-fp-stroke:nth-of-type(4) { animation-delay: 0.45s; }
        .login-ico-wrap-fp .login-fp-stroke:nth-of-type(5) { animation-delay: 0.6s; }
        .login-ico-wrap-key { animation: login-ico-nudge 2.8s ease-in-out infinite; transform-origin: 12px 12px; }
        @media (prefers-reduced-motion: reduce) {
            .login-live-face, .login-live-finger, .login-live-key,
            .login-ico-wrap-face, .login-ico-wrap-fp .login-fp-stroke, .login-ico-wrap-key,
            .login-tile-shimmer { animation: none !important; }
            .login-ico-wrap-fp .login-fp-stroke { stroke-dasharray: unset; }
            .login-tile-shimmer { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-effect">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-r from-pink-500 to-red-500 rounded-full flex items-center justify-center">
                            <span class="text-white font-bold text-lg">🐷</span>
                        </div>
                        <span class="text-xl font-bold text-gray-800 dark:text-white">Farm A</span>
                    </a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                        <svg id="sun-icon" class="w-5 h-5 text-gray-800 dark:text-gray-200 hidden" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
                        </svg>
                        <svg id="moon-icon" class="w-5 h-5 text-gray-800 dark:text-gray-200" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="min-h-screen gradient-bg relative overflow-hidden flex items-center justify-center px-4 py-16 sm:py-20">
        <!-- Animated Background Elements -->
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute top-10 sm:top-20 left-4 sm:left-10 w-12 h-12 sm:w-20 sm:h-20 bg-white/10 rounded-full animate-pulse"></div>
            <div class="absolute top-20 sm:top-40 right-4 sm:right-20 w-10 h-10 sm:w-16 sm:h-16 bg-white/10 rounded-full animate-pulse" style="animation-delay: 1s;"></div>
            <div class="absolute bottom-10 sm:bottom-20 left-1/4 w-16 h-16 sm:w-24 sm:h-24 bg-white/10 rounded-full animate-pulse" style="animation-delay: 2s;"></div>
            <div class="absolute bottom-20 sm:bottom-40 right-1/3 w-8 h-8 sm:w-12 sm:h-12 bg-white/10 rounded-full animate-pulse" style="animation-delay: 3s;"></div>
        </div>

        <div class="relative z-10 w-full max-w-sm sm:max-w-md mx-auto">
            <!-- Login Card -->
            <div class="login-card rounded-xl sm:rounded-2xl shadow-2xl p-6 sm:p-8">
                <!-- Header: live sign-in method icons -->
                <div class="text-center mb-6 sm:mb-8">
                    <div class="flex justify-center items-stretch gap-3 sm:gap-5 mb-5" role="img" aria-label="Face ID, fingerprint, and passkey sign-in available">
                        <div class="login-auth-tile login-live-face w-[4.5rem] h-[4.5rem] sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-emerald-600/8 dark:from-emerald-400/25 dark:to-emerald-900/30 border border-emerald-400/40 dark:border-emerald-500/40 text-emerald-600 dark:text-emerald-300 shadow-sm" title="Face ID">
                            <div class="login-tile-shimmer" aria-hidden="true"></div>
                            <div class="relative z-10 flex h-full w-full items-center justify-center p-1.5">
                                <svg class="h-9 w-9 sm:h-10 sm:w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true">
                                    <g class="login-ico-wrap-face" style="transform-box: fill-box; transform-origin: 50% 50%;">
                                        <circle cx="12" cy="12" r="8.5" />
                                        <circle cx="9" cy="9.5" r="0.7" fill="currentColor" stroke="none">
                                            <animate attributeName="r" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite" />
                                            <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite" />
                                        </circle>
                                        <circle cx="15" cy="9.5" r="0.7" fill="currentColor" stroke="none">
                                            <animate attributeName="r" values="0.5;0.9;0.5" dur="2.2s" begin="0.15s" repeatCount="indefinite" />
                                            <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" begin="0.15s" repeatCount="indefinite" />
                                        </circle>
                                        <path stroke-linecap="round" d="M8 14.2c.9 1.1 1.6 1.4 2.3 1.4h3.2c.8 0 1.3-.2 1.6-.5" />
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="login-auth-tile login-live-finger w-[4.5rem] h-[4.5rem] sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-br from-teal-500/20 to-cyan-600/8 dark:from-teal-400/25 dark:to-cyan-950/30 border border-teal-400/40 dark:border-teal-500/40 text-teal-600 dark:text-teal-200 shadow-sm" title="Touch / fingerprint">
                            <div class="login-tile-shimmer" aria-hidden="true" style="animation-direction: reverse;"></div>
                            <div class="relative z-10 flex h-full w-full items-center justify-center p-1.5">
                                <svg class="login-ico-wrap-fp h-9 w-9 sm:h-10 sm:w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path class="login-fp-stroke" d="M4 8c1.2 0 1.2 1.3 2.2 1.3s1-1.3 2.2-1.3 1.2 1.3 2.2 1.3 1.2-1.3 2.2-1.3 1.2 1.3 2.2 1.3 1.2-1.3 2.2-1.3" />
                                    <path class="login-fp-stroke" d="M4 12c1.2 0 1.2 1.2 2.1 1.2s.9-1.2 2.1-1.2" />
                                    <path class="login-fp-stroke" d="M4 16c.8 0 1.2.6 1.5.8" />
                                    <path class="login-fp-stroke" d="M12.5 7c.5 2.2 0 3.3 0 4.8" />
                                    <path class="login-fp-stroke" d="M9 20c0-1.2.2-2.2.4-2.8" />
                                </svg>
                            </div>
                        </div>
                        <div class="login-auth-tile login-live-key w-[4.5rem] h-[4.5rem] sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-br from-pink-500/20 to-rose-600/8 dark:from-pink-400/25 dark:to-rose-950/30 border border-pink-400/40 dark:border-pink-500/40 text-pink-600 dark:text-pink-200 shadow-sm" title="Passkey">
                            <div class="login-tile-shimmer" aria-hidden="true"></div>
                            <div class="relative z-10 flex h-full w-full items-center justify-center p-1.5">
                                <svg class="h-9 w-9 sm:h-10 sm:w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <g class="login-ico-wrap-key" style="transform-box: fill-box; transform-origin: 50% 50%;">
                                        <path d="M6.5 8.5A3.5 3.5 0 0 1 9.1 3.1A3.5 3.5 0 0 1 14.5 5.5V7" />
                                        <path d="M10.2 6.2L18.5 11.5" />
                                        <path d="M18.5 11.5v2.2" />
                                        <path d="M18.5 15.2h-1" />
                                    </g>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-white mb-1">Employee Login</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400 max-w-xs mx-auto">Code + password, or code only for Face ID / touch / passkey.</p>
                </div>

                <!-- Login Form: one Sign in — password if filled, else device -->
                <form id="loginForm" class="space-y-4 sm:space-y-5">
                    <div>
                        <label for="employee_code" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Employee code
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-4 w-4 sm:h-5 sm:w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </div>
                            <input type="text" id="employee_code" name="employee_code" required maxlength="6" pattern="[0-9]{6}"
                                class="block w-full pl-10 pr-3 py-2.5 sm:py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 text-sm sm:text-base"
                                placeholder="000000" inputmode="numeric" autocomplete="username">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-baseline justify-between gap-2 mb-2">
                            <label for="password" class="text-sm font-medium text-gray-700 dark:text-gray-300">
                                Password
                            </label>
                            <span class="text-xs text-gray-500 dark:text-gray-500">optional</span>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-4 w-4 sm:h-5 sm:w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                </svg>
                            </div>
                            <input type="password" id="password" name="password"
                                class="block w-full pl-10 pr-12 py-2.5 sm:py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 text-sm sm:text-base"
                                placeholder="Leave blank to use Face ID, fingerprint, or passkey"
                                autocomplete="current-password" aria-describedby="password-hint">
                            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 focus:outline-none" title="Show password" aria-label="Toggle password visibility">
                                <svg id="eye-icon" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                                <svg id="eye-slash-icon" class="w-4 h-4 sm:w-5 sm:h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                                </svg>
                            </button>
                        </div>
                        <p id="password-hint" class="text-xs text-gray-500 dark:text-gray-500 mt-1.5">Empty password → device. One-time setup in <a class="text-pink-600 dark:text-pink-400 hover:underline" href="/profile">Profile</a>.</p>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox"
                                class="h-4 w-4 text-pink-600 focus:ring-pink-500 border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-sm text-pink-600 hover:text-pink-500 dark:text-pink-400">
                            Forgot password?
                        </a>
                    </div>

                    <div>
                        <button type="submit" id="login-submit-btn"
                            class="group relative w-full flex justify-center items-center gap-2 py-3 sm:py-3.5 px-4 border border-transparent text-sm sm:text-base font-semibold rounded-xl text-white bg-gradient-to-r from-slate-700 via-pink-600 to-rose-600 hover:from-slate-600 hover:via-pink-500 hover:to-rose-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 dark:focus:ring-offset-gray-800 shadow-lg transition-all duration-200">
                            <span class="flex items-center gap-1.5 text-white/90" aria-hidden="true">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01M3 12a9 9 0 1 0 2.1-5.7" /></svg>
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-4" /></svg>
                            </span>
                            <span id="login-submit-label">Sign in with device</span>
                        </button>
                    </div>

                    <!-- Error Message -->
                    <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative dark:bg-red-900 dark:border-red-700 dark:text-red-200">
                        <span id="error-text"></span>
                    </div>
                </form>

                <!-- Footer -->
                <div class="mt-6 sm:mt-8 text-center">
                    <p class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 mb-2">
                        Don't have an account? 
                    </p>
                    <a href="/employee/signup" class="inline-block bg-gradient-to-r from-green-500 to-blue-500 text-white px-4 sm:px-6 py-2 rounded-lg hover:from-green-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105 text-sm sm:text-base">
                        Create Account
                    </a>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        
        // Check for saved theme preference using shared keys
        const currentTheme = localStorage.getItem('theme');
        const currentDarkMode = localStorage.getItem('darkMode');
        const currentColorTheme = localStorage.getItem('color-theme');
        const isInitiallyDark = currentTheme === 'dark' || currentDarkMode === 'true' || currentColorTheme === 'dark';
        document.documentElement.classList.toggle('dark', isInitiallyDark);
        document.body.classList.toggle('dark', isInitiallyDark);
        updateThemeIcon();
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.body.classList.toggle('dark', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        });
        
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            sunIcon.classList.toggle('hidden', isDark);
            moonIcon.classList.toggle('hidden', !isDark);
        }

        // Password visibility toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeSlashIcon = document.getElementById('eye-slash-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeSlashIcon.classList.remove('hidden');
                this.setAttribute('title', 'Hide password');
                this.setAttribute('aria-label', 'Hide password');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeSlashIcon.classList.add('hidden');
                this.setAttribute('title', 'Show password');
                this.setAttribute('aria-label', 'Show password');
            }
        });

        // Employee code input validation
        document.getElementById('employee_code').addEventListener('input', function(e) {
            // Only allow numbers
            this.value = this.value.replace(/[^0-9]/g, '');
            
            // Limit to 6 digits
            if (this.value.length > 6) {
                this.value = this.value.slice(0, 6);
            }
        });

        // WebAuthn helpers (shared)
        function b64uToBuf(s) {
            if (!s) return new ArrayBuffer(0);
            s = s.replace(/-/g, '+').replace(/_/g, '/');
            const pad = s.length % 4 ? 4 - (s.length % 4) : 0;
            if (pad) s += '='.repeat(pad);
            const str = atob(s);
            const buf = new ArrayBuffer(str.length);
            const v = new Uint8Array(buf);
            for (let i = 0; i < str.length; i++) v[i] = str.charCodeAt(i);
            return buf;
        }
        function bufB64u(buf) {
            const b = new Uint8Array(buf);
            let s = '';
            for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
            return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/,'');
        }
        function prepGet(o) {
            const x = Object.assign({}, o);
            x.challenge = b64uToBuf(x.challenge);
            if (x.allowCredentials && x.allowCredentials.length) {
                x.allowCredentials = x.allowCredentials.map(function (c) {
                    return Object.assign({}, c, { id: b64uToBuf(c.id) });
                });
            }
            return x;
        }
        function assertToJSON(cred) {
            const r = cred.response;
            const out = {
                id: cred.id,
                rawId: bufB64u(cred.rawId),
                type: cred.type,
                response: {
                    clientDataJSON: bufB64u(r.clientDataJSON),
                    authenticatorData: bufB64u(r.authenticatorData),
                    signature: bufB64u(r.signature)
                }
            };
            if (r.userHandle && r.userHandle.byteLength) out.response.userHandle = bufB64u(r.userHandle);
            return out;
        }

        (function defaultSubmitLabel() {
            const pw = document.getElementById('password');
            const label = document.getElementById('login-submit-label');
            if (!pw || !label) return;
            function tick() {
                if ((pw.value || '').trim().length >= 1) {
                    label.textContent = 'Sign in with password';
                } else {
                    label.textContent = 'Sign in with device';
                }
            }
            pw.addEventListener('input', tick);
            tick();
        })();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const employeeCode = (document.getElementById('employee_code').value || '').trim();
            const passwordRaw = (document.getElementById('password').value || '');
            const password = passwordRaw.trim();
            const errBox = document.getElementById('error-message');
            const errText = document.getElementById('error-text');
            const submitBtn = document.getElementById('login-submit-btn');
            const labelEl = document.getElementById('login-submit-label');
            if (!submitBtn) return;

            function showErr(t) {
                if (errText) errText.textContent = t;
                if (errBox) errBox.classList.remove('hidden');
            }
            function clearErr() {
                if (errBox) errBox.classList.add('hidden');
            }

            if (employeeCode.length !== 6 || !/^\d{6}$/.test(employeeCode)) {
                showErr('Enter a valid 6-digit employee code.');
                return;
            }
            if (password.length > 0 && password.length < 6) {
                showErr('Password must be at least 6 characters, or clear the field to use Face ID / fingerprint / passkey.');
                return;
            }

            const usePassword = password.length >= 6;
            const defaultBtnHtml = submitBtn.innerHTML;
            clearErr();
            submitBtn.disabled = true;
            if (usePassword) {
                if (labelEl) labelEl.textContent = 'Signing in…';
            } else {
                if (labelEl) labelEl.textContent = 'Contacting device…';
            }

            try {
                if (usePassword) {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({ employee_code: employeeCode, password: password })
                    });
                    let data;
                    try {
                        data = await res.json();
                    } catch (e) {
                        showErr('Server error. Try again.');
                        return;
                    }
                    if (data.success) {
                        window.location.href = data.redirect;
                        return;
                    }
                    showErr(data.message || 'Sign-in failed. Check your code and password.');
                    return;
                }

                if (!window.PublicKeyCredential) {
                    showErr('This browser can’t use Face ID or a passkey. Enter your password (6+ characters).');
                    return;
                }
                if (typeof window.isSecureContext !== 'undefined' && !window.isSecureContext) {
                    showErr('Open this app on https, http://127.0.0.1, or http://localhost to use your device. Otherwise use a password.');
                    return;
                }

                const b0 = await fetch('/api/webauthn/login/begin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ employee_code: employeeCode })
                });
                const t0 = await b0.text();
                let d0;
                try { d0 = JSON.parse(t0); } catch (e) {
                    showErr('Server error. Try again or use your password.');
                    return;
                }
                if (!d0.success || !d0.options) {
                    showErr((d0 && d0.error) || 'Add this device in Profile first (log in with a password once), then try again.');
                    return;
                }
                if (labelEl) labelEl.textContent = 'Complete on your device…';
                const assertion = await navigator.credentials.get({ publicKey: prepGet(d0.options) });
                const b1 = await fetch('/api/webauthn/login/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ credential: assertToJSON(assertion) })
                });
                const t1 = await b1.text();
                let d1;
                try { d1 = JSON.parse(t1); } catch (e) {
                    showErr('Server error. Try your password or check the app terminal.');
                    return;
                }
                if (d1.success && d1.redirect) {
                    window.location.href = d1.redirect;
                } else {
                    showErr((d1 && d1.error) || 'Device sign-in failed. Try your password.');
                }
            } catch (err) {
                if (usePassword) {
                    showErr('Network error. Check your connection.');
                } else {
                    const m = (err && err.name === 'NotAllowedError')
                        ? 'Cancelled. You can try again or sign in with a password.'
                        : ((err && err.message) || 'Could not use this device. Enter your password above.');
                    showErr(m);
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = defaultBtnHtml;
                const p = document.getElementById('password');
                if (p) p.dispatchEvent(new Event('input', { bubbles: true }));
            }
        });

        // Add some interactive animations
        document.addEventListener('DOMContentLoaded', function() {
            // Animate the login card on load
            const loginCard = document.querySelector('.login-card');
            loginCard.style.opacity = '0';
            loginCard.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                loginCard.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                loginCard.style.opacity = '1';
                loginCard.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>

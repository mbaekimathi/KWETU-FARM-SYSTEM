{# Post-login welcome: first briefing is shown inside Aira (floating assistant). Fetches /api/session/welcome once. #}
<script>
(function() {
    function esc(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    function urgencyClasses(u) {
        var map = {
            overdue: 'farm-ai-w-chip farm-ai-w-chip--overdue',
            due_today: 'farm-ai-w-chip farm-ai-w-chip--due-today',
            due_soon: 'farm-ai-w-chip farm-ai-w-chip--due-soon',
            upcoming: 'farm-ai-w-chip farm-ai-w-chip--upcoming',
            now: 'farm-ai-w-chip farm-ai-w-chip--now'
        };
        return map[u] || map.upcoming;
    }
    function buildBreakdown(uc) {
        if (!uc) return '';
        var parts = [];
        if (uc.now) parts.push('<span class="farm-ai-w-breakdown farm-ai-w-breakdown--now">' + uc.now + ' now</span>');
        if (uc.overdue) parts.push('<span class="farm-ai-w-breakdown farm-ai-w-breakdown--overdue">' + uc.overdue + ' overdue</span>');
        if (uc.due_today) parts.push('<span class="farm-ai-w-breakdown farm-ai-w-breakdown--due-today">' + uc.due_today + ' due today</span>');
        if (uc.due_soon) parts.push('<span class="farm-ai-w-breakdown farm-ai-w-breakdown--due-soon">' + uc.due_soon + ' due soon</span>');
        if (uc.upcoming) parts.push('<span class="farm-ai-w-breakdown farm-ai-w-breakdown--upcoming">' + uc.upcoming + ' upcoming</span>');
        return parts.length ? parts.join(' · ') : '';
    }
    function buildWelcomeHtml(data) {
        var greet = esc(data.greeting || 'Hello');
        var name = esc(data.name || 'there');
        var clock = esc(data.clock || '');
        var sub = data.error
            ? 'Some activity data could not be loaded. You can still use the app.'
            : "Here are today’s activities that need your attention, grouped by type.";
        var headBlock = ''
            + '<div class="farm-ai-chat-bubble farm-ai-chat-bubble--bot farm-ai-chat-bubble--welcome-lead">'
            + '<div class="farm-ai-chat-bubble__label">Aira</div>'
            + '<p class="farm-ai-chat-bubble__text farm-ai-w-clock">' + greet + (clock ? ' · ' + clock : '') + '</p>'
            + '<p class="farm-ai-chat-bubble__text farm-ai-w-headline">' + greet + ', ' + name + ' 👋</p>'
            + '<p class="farm-ai-w-sub">' + esc(sub) + '</p>'
            + '</div>';

        if (data.error) {
            return headBlock
                + '<div class="farm-ai-chat-bubble farm-ai-chat-bubble--bot">'
                + '<p class="farm-ai-chat-bubble__text">' + esc(data.error) + '</p></div>'
                + footerNote();
        }

        var cats = data.categories || [];
        if (cats.length === 0) {
            return headBlock
                + '<div class="farm-ai-chat-bubble farm-ai-chat-bubble--bot">'
                + '<p class="farm-ai-chat-bubble__text">No scheduled alerts for this moment. You are all caught up for now.</p></div>'
                + footerNote();
        }

        var sections = cats.map(function(cat) {
            var breakdown = buildBreakdown(cat.urgency_breakdown);
            var prev = (cat.previews || []).map(function(p) {
                var chip = p.urgency_label
                    ? '<span class="' + urgencyClasses(p.urgency) + '">' + esc(p.urgency_label) + '</span>'
                    : '';
                return '<li class="farm-ai-w-item">'
                    + '<span class="farm-ai-w-item__txt">' + esc(p.summary) + '</span>' + chip + '</li>';
            }).join('');
            var urgent = cat.highest_priority === 'critical'
                ? '<span class="farm-ai-w-urgent-flag">Urgent</span>'
                : '';
            return '<section class="farm-ai-w-section">'
                + '<div class="farm-ai-w-section__head">'
                + '<h3 class="farm-ai-w-section__title">' + esc(cat.category_label || cat.type) + '</h3>'
                + '<span class="farm-ai-w-section__count">' + esc(String(cat.count || 0)) + ' items' + urgent + '</span></div>'
                + (breakdown ? '<p class="farm-ai-w-section__breakdown">' + breakdown + '</p>' : '')
                + '<ul class="farm-ai-w-list">' + prev + '</ul></section>';
        }).join('');

        return headBlock
            + '<div class="farm-ai-w-wrap">' + sections + '</div>'
            + footerNote();
    }
    function footerNote() {
        return '<div class="farm-ai-chat-bubble farm-ai-chat-bubble--bot farm-ai-chat-bubble--welcome-foot">'
            + '<p class="farm-ai-chat-bubble__text"><strong>AI automation is coming soon.</strong> This briefing is a preview of what Aira will help you with.</p>'
            + '</div>';
    }
    function pushToAira(html) {
        if (typeof window.farmAiraShowLoginWelcome !== 'function') return;
        if (window.farmAiraShowLoginWelcome(html)) return;
        var n = 0;
        var id = setInterval(function() {
            if (window.farmAiraShowLoginWelcome(html)) { clearInterval(id); return; }
            if (++n >= 60) clearInterval(id);
        }, 50);
    }
    function run() {
        fetch('/api/session/welcome', { credentials: 'same-origin' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data || !data.show) return;
                pushToAira(buildWelcomeHtml(data));
            })
            .catch(function() { /* silent */ });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
    else run();
})();
</script>

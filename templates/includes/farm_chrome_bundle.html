{# Shared farm admin chrome — unified theme for header, sidebar, footer #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/farm_chrome.css') }}">
<script>
(function () {
  document.documentElement.classList.add('farm-unified-shell');
  /* Most farm sidebars use md:translate-x-0 (768px); base_employee uses lg (1024). Corrected in setupSidebarToggle. */
  if (!document.documentElement.hasAttribute('data-farm-sidebar-bp')) {
    document.documentElement.setAttribute('data-farm-sidebar-bp', '768');
  }
  var clockTimer = null;

  function isDarkMode() {
    return document.documentElement.classList.contains('dark');
  }

  function setDarkMode(enabled) {
    document.documentElement.classList.toggle('dark', enabled);
    if (document.body) {
      document.body.classList.toggle('dark', enabled);
    }
    try {
      localStorage.setItem('theme', enabled ? 'dark' : 'light');
      localStorage.setItem('darkMode', enabled ? 'true' : 'false');
      localStorage.setItem('color-theme', enabled ? 'dark' : 'light');
    } catch (e) {}
  }

  try {
    var savedTheme = localStorage.getItem('theme');
    var savedDarkMode = localStorage.getItem('darkMode');
    var savedColorTheme = localStorage.getItem('color-theme');
    var shouldEnableDark =
      savedTheme === 'dark' ||
      savedColorTheme === 'dark' ||
      savedDarkMode === 'true';
    if (savedTheme === 'light' || savedColorTheme === 'light' || savedDarkMode === 'false') {
      shouldEnableDark = false;
    }
    setDarkMode(shouldEnableDark);
  } catch (e) {}

  function onReady(callback) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', callback, { once: true });
      return;
    }
    callback();
  }

  function syncColorScheme() {
    document.documentElement.style.colorScheme = document.documentElement.classList.contains('dark')
      ? 'dark'
      : 'light';
  }
  syncColorScheme();
  try {
    new MutationObserver(syncColorScheme).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['class']
    });
  } catch (e) {}

  function tickClock() {
    var t = document.getElementById('live-time');
    var d = document.getElementById('live-date');
    if (!t || !d) return;
    var n = new Date();
    t.textContent = n.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    d.textContent = n.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function syncThemeIconsIn(toggleEl) {
    if (!toggleEl) return;
    var sunIcon = toggleEl.querySelector('.farm-chrome-theme-toggle__sun, #sun-icon');
    var moonIcon = toggleEl.querySelector('.farm-chrome-theme-toggle__moon, #moon-icon');
    if (!sunIcon || !moonIcon) return;
    var isDark = isDarkMode();
    sunIcon.classList.toggle('hidden', !isDark);
    moonIcon.classList.toggle('hidden', isDark);
  }

  function syncThemeIcons() {
    var toggles = document.querySelectorAll('[data-theme-toggle], #theme-toggle');
    if (!toggles || !toggles.length) return;
    toggles.forEach(function (toggleEl) {
      syncThemeIconsIn(toggleEl);
    });
  }

  function setupThemeToggle() {
    if (document.documentElement.dataset.farmThemeBound === '1') {
      syncThemeIcons();
      return;
    }
    document.documentElement.dataset.farmThemeBound = '1';
    syncThemeIcons();

    document.addEventListener('click', function (e) {
      var toggleEl = e.target && e.target.closest && e.target.closest('[data-theme-toggle], #theme-toggle');
      if (!toggleEl) return;
      e.preventDefault();
      e.stopPropagation();
      if (typeof e.stopImmediatePropagation === 'function') {
        e.stopImmediatePropagation();
      }
      setDarkMode(!isDarkMode());
      syncColorScheme();
      syncThemeIcons();
    }, true);
  }

  function setupUserDropdown() {
    if (document.documentElement.dataset.farmUserDropdownBound === '1') return;
    document.documentElement.dataset.farmUserDropdownBound = '1';

    function getRoot(el) {
      if (!el || !el.closest) return null;
      return el.closest('[data-user-dropdown-root]');
    }

    function getMenu(root) {
      if (!root) return null;
      return root.querySelector('[data-user-dropdown-menu]') || root.querySelector('#user-dropdown');
    }

    function getToggle(root) {
      if (!root) return null;
      return root.querySelector('[data-user-dropdown-toggle]') || root.querySelector('#user-dropdown-btn');
    }

    function closeAllDropdowns() {
      var menus = document.querySelectorAll('[data-user-dropdown-menu], #user-dropdown');
      menus.forEach(function (menu) {
        menu.classList.add('hidden');
      });
    }

    document.addEventListener('click', function (e) {
      var toggle = e.target && e.target.closest && e.target.closest('[data-user-dropdown-toggle], #user-dropdown-btn');
      if (toggle) {
        var root = getRoot(toggle);
        var menu = getMenu(root);
        if (!menu) return;
        e.preventDefault();
        e.stopPropagation();
        if (typeof e.stopImmediatePropagation === 'function') {
          e.stopImmediatePropagation();
        }
        var shouldOpen = menu.classList.contains('hidden');
        closeAllDropdowns();
        if (shouldOpen) {
          menu.classList.remove('hidden');
        }
        return;
      }

      var openMenus = document.querySelectorAll('[data-user-dropdown-menu]:not(.hidden), #user-dropdown:not(.hidden)');
      var clickedInsideAnyOpenDropdown = false;
      openMenus.forEach(function (menu) {
        var root = getRoot(menu);
        var btn = getToggle(root);
        if (menu.contains(e.target) || (btn && btn.contains(e.target))) {
          clickedInsideAnyOpenDropdown = true;
        }
      });
      if (!clickedInsideAnyOpenDropdown) {
        closeAllDropdowns();
      }
    }, true);
  }

  function setupClock() {
    tickClock();
    if (clockTimer) return;
    clockTimer = setInterval(tickClock, 1000);
  }

  function setupSidebarBack() {
    if (document.documentElement.dataset.farmSidebarBackBound === '1') return;
    document.documentElement.dataset.farmSidebarBackBound = '1';
    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest && e.target.closest('[data-farm-sidebar-back]');
      if (!btn) return;
      e.preventDefault();
      var refOk = false;
      try {
        refOk = !!document.referrer && new URL(document.referrer).origin === window.location.origin;
      } catch (err) {}
      if (refOk || window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }, true);
  }

  function setupSidebarToggle() {
    var mobileMenuBtn = document.getElementById('mobile-menu-btn');
    var sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
    var sidebar = document.getElementById('sidebar');
    var closeSidebarBtn = document.getElementById('close-sidebar');
    var overlay = document.getElementById('mobile-overlay') || document.getElementById('sidebar-overlay');
    if (!sidebar) {
      document.documentElement.setAttribute('data-farm-sidebar-bp', 'none');
      return;
    }
    if (sidebar.dataset.farmSidebarBound === '1') return;

    if (sidebarToggleBtn && mobileMenuBtn) {
      sidebarToggleBtn.classList.add('hidden');
    }

    var toggleBtn = mobileMenuBtn || sidebarToggleBtn;

    var desktopBreakpoint = sidebar.className.indexOf('lg:translate-x-0') !== -1 ? 1024 : 768;

    function syncSidebarBreakpointAttr() {
      var c = sidebar.className || '';
      var bp = c.indexOf('lg:translate-x-0') !== -1 ? '1024' : '768';
      document.documentElement.setAttribute('data-farm-sidebar-bp', bp);
    }

    function syncToggleButton(isOpen, isDesktop) {
      if (!toggleBtn) return;
      if (isDesktop) {
        toggleBtn.classList.add('hidden');
        return;
      }
      toggleBtn.classList.remove('hidden');
      toggleBtn.setAttribute('aria-label', isOpen ? 'Close sidebar' : 'Open sidebar');
      toggleBtn.setAttribute('title', isOpen ? 'Close sidebar' : 'Open sidebar');
      var icon = toggleBtn.querySelector('i');
      if (icon) {
        icon.className = isOpen ? 'fas fa-times text-sm' : 'fas fa-bars text-sm';
      }
    }

    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      sidebar.classList.add('translate-x-0');
      if (overlay) overlay.classList.remove('hidden');
      syncToggleButton(true, false);
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      sidebar.classList.remove('translate-x-0');
      if (overlay) overlay.classList.add('hidden');
      syncToggleButton(false, false);
    }

    function syncSidebarForViewport() {
      syncSidebarBreakpointAttr();
      var isDesktop = window.innerWidth >= desktopBreakpoint;
      if (isDesktop) {
        if (overlay) overlay.classList.add('hidden');
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0');
        syncToggleButton(true, true);
      } else {
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0');
        syncToggleButton(false, false);
      }
    }

    syncSidebarBreakpointAttr();
    sidebar.dataset.farmSidebarBound = '1';
    if (mobileMenuBtn) {
      mobileMenuBtn.dataset.farmSidebarBound = '1';
      mobileMenuBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (sidebar.classList.contains('-translate-x-full')) openSidebar();
        else closeSidebar();
      });
    }

    if (sidebarToggleBtn) {
      sidebarToggleBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (sidebar.classList.contains('-translate-x-full')) openSidebar();
        else closeSidebar();
      });
    }

    if (closeSidebarBtn) {
      closeSidebarBtn.addEventListener('click', function (e) {
        e.preventDefault();
        closeSidebar();
      });
    }

    if (overlay) {
      overlay.addEventListener('click', function () {
        closeSidebar();
      });
    }

    sidebar.addEventListener('click', function (e) {
      var navTarget = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!navTarget) return;
      if (window.innerWidth < desktopBreakpoint) closeSidebar();
    });

    window.addEventListener('resize', syncSidebarForViewport);
    syncSidebarForViewport();
  }

  function ensurePermissionDeniedModal() {
    if (document.getElementById('permission-denied-modal')) return;
    var modal = document.createElement('div');
    modal.id = 'permission-denied-modal';
    modal.className = 'hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4';
    modal.innerHTML = `
      <div class="w-full max-w-md rounded-2xl bg-white dark:bg-slate-800 shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-5 text-white">
          <div class="text-center">
            <h3 class="text-lg font-semibold">Access Restricted</h3>
            <p class="text-xs text-indigo-100 mt-1">Permission required for this action</p>
          </div>
        </div>
        <div class="px-6 py-5">
          <div class="flex justify-center mb-5">
            <div class="permission-padlock-shell">
              <div class="permission-padlock-body">
                <span class="permission-padlock-emoji" aria-hidden="true">🔒</span>
              </div>
            </div>
          </div>
          <p id="permission-denied-message" class="text-sm text-slate-700 dark:text-slate-200">
            You do not have enough permissions for this action.
          </p>
          <div class="mt-5 flex justify-end">
            <button type="button" id="permission-denied-close" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium">
              Okay
            </button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    var style = document.createElement('style');
    style.textContent = `
      @keyframes permissionPadlockPulse {
        0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 10px 25px rgba(79,70,229,.25); }
        50% { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 30px rgba(79,70,229,.35); }
      }
      .permission-padlock-shell {
        width: 108px;
        height: 108px;
        border-radius: 9999px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: permissionPadlockPulse 1100ms ease-in-out infinite;
      }
      .permission-padlock-body {
        width: 84px;
        height: 84px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
      }
      .permission-padlock-emoji {
        font-size: 2.8rem;
        line-height: 1;
        filter: drop-shadow(0 2px 2px rgba(15, 23, 42, 0.25));
      }
    `;
    document.head.appendChild(style);

    var close = function () { modal.classList.add('hidden'); };
    var closeBtn = document.getElementById('permission-denied-close');
    if (closeBtn) closeBtn.addEventListener('click', close);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) close();
    });
  }

  function showPermissionDeniedModal(message) {
    ensurePermissionDeniedModal();
    var modal = document.getElementById('permission-denied-modal');
    var messageNode = document.getElementById('permission-denied-message');
    if (messageNode && message) {
      messageNode.textContent = message;
    }
    if (modal) {
      modal.classList.remove('hidden');
    }
  }

  function setupPermissionDeniedFetchGuard() {
    if (window.__farmPermissionFetchGuardBound) return;
    window.__farmPermissionFetchGuardBound = true;
    var originalFetch = window.fetch.bind(window);
    window.fetch = function () {
      return originalFetch.apply(null, arguments).then(function (response) {
        try {
          var contentType = response.headers.get('content-type') || '';
          if (response.status === 403 && contentType.indexOf('application/json') !== -1) {
            response.clone().json().then(function (data) {
              if (data && data.code === 'PERMISSION_DENIED') {
                showPermissionDeniedModal(
                  data.message || 'You do not have enough permissions for this action.'
                );
              }
            }).catch(function () {});
          }
        } catch (e) {}
        return response;
      });
    };
  }

  function setupPermissionDeniedAlertGuard() {
    if (window.__farmPermissionAlertGuardBound) return;
    window.__farmPermissionAlertGuardBound = true;
    var originalAlert = window.alert ? window.alert.bind(window) : null;
    if (!originalAlert) return;

    window.alert = function (message) {
      var text = String(message || '');
      var normalized = text.toLowerCase();
      if (
        normalized.indexOf('permission denied') !== -1 ||
        normalized.indexOf('not have permission') !== -1 ||
        normalized.indexOf('not authorized') !== -1 ||
        normalized.indexOf('not enough permissions') !== -1
      ) {
        showPermissionDeniedModal('You do not have enough permissions for this action.');
        return;
      }
      originalAlert(message);
    };
  }

  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest && e.target.closest('[data-farm-api-logout]');
    if (!el) return;
    e.preventDefault();
    fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.success && data.redirect) window.location.href = data.redirect;
        else window.location.href = '/';
      })
      .catch(function () { window.location.href = '/'; });
  });

  onReady(function () {
    setupThemeToggle();
    setupUserDropdown();
    setupSidebarBack();
    setupSidebarToggle();
    setupPermissionDeniedFetchGuard();
    setupPermissionDeniedAlertGuard();
    setupClock();
    syncThemeIcons();
  });
})();
</script>

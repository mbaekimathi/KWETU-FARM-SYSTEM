{# Slaughter hub page only: theme, user menu, mobile sidebar (avoids duplicate const with view-production script) #}
<script>
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.toggle('dark', currentTheme === 'dark');
        updateThemeIcon();
        
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeIcon();
            });
        }
        
        function updateThemeIcon() {
            if (!sunIcon || !moonIcon) return;
            const isDark = document.documentElement.classList.contains('dark');
            sunIcon.classList.toggle('hidden', isDark);
            moonIcon.classList.toggle('hidden', !isDark);
        }

        const userDropdownBtn = document.getElementById('user-dropdown-btn');
        const userDropdown = document.getElementById('user-dropdown');
        if (userDropdownBtn && userDropdown) {
            userDropdownBtn.addEventListener('click', () => {
                userDropdown.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!userDropdownBtn.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.classList.add('hidden');
                }
            });
        }

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        
        function slaughterCloseMobileSidebar() {
            if (sidebar) sidebar.classList.add('-translate-x-full');
            if (mobileOverlay) mobileOverlay.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }
        function slaughterOpenMobileSidebar() {
            if (sidebar) sidebar.classList.remove('-translate-x-full');
            if (mobileOverlay) mobileOverlay.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }
        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', slaughterOpenMobileSidebar);
        }
        
        if (closeSidebarBtn) {
            closeSidebarBtn.addEventListener('click', slaughterCloseMobileSidebar);
        }
        if (mobileOverlay) {
            mobileOverlay.addEventListener('click', slaughterCloseMobileSidebar);
        }
        window.addEventListener('resize', function () {
            if (window.innerWidth >= 768 && sidebar) {
                sidebar.classList.remove('-translate-x-full');
                if (mobileOverlay) mobileOverlay.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            } else if (window.innerWidth < 768 && sidebar) {
                sidebar.classList.add('-translate-x-full');
            }
        });
</script>
